metadata:
  name: pth-facebookresearch-sam3-server
  namespace: cvat
  annotations:
    name: Segment Anything 3 Server
    version: 2
    type: interactor
    spec:
    min_pos_points: 0
    min_neg_points: 0
    startswith_box_optional: true
    help_message: Use one optional box and positive or negative points to segment an object with server-side SAM3

spec:
  description: Full server-side SAM3 interactive segmentation
  runtime: "python:3.10"
  handler: main:handler
  eventTimeout: 120s
  env:
    - name: HF_HOME
      value: /opt/nuclio/.cache/huggingface
    - name: NVIDIA_VISIBLE_DEVICES
      value: all
    - name: SAM3_IMAGE_CACHE_SIZE
      value: "2"
    - name: SAM3_TEXT_CACHE_SIZE
      value: "32"

  build:
    image: cvat.pth.facebookresearch.sam3.server:latest-gpu
    baseImage: ubuntu:22.04

    directives:
      preCopy:
        - kind: ENV
          value: NVIDIA_VISIBLE_DEVICES=all
        - kind: ENV
          value: NVIDIA_DRIVER_CAPABILITIES=compute,utility
        - kind: ENV
          value: DEBIAN_FRONTEND=noninteractive
        - kind: WORKDIR
          value: /opt/nuclio
        - kind: RUN
          value: apt-get update && apt-get -y install git python3 python3-pip python-is-python3 && rm -rf /var/lib/apt/lists/*
        - kind: RUN
          value: python3 -m pip install pip==26.2.1 setuptools==80.10.2 wheel==0.48.0 --no-cache-dir
        - kind: RUN
          value: python3 -m pip install torch==2.13.0 torchvision==0.28.0 einops pillow psutil pycocotools git+https://github.com/facebookresearch/sam3.git@8f0b7f4d4e7eda2ed606ebde6702c93359ad01da --no-cache-dir
        - kind: RUN
          value: python3 -c "from sam3.model.sam3_image_processor import Sam3Processor"

  triggers:
    myHttpTrigger:
      numWorkers: 1
      kind: http
      workerAvailabilityTimeoutMilliseconds: 300000
      attributes:
        maxRequestBodySize: 33554432

  devices:
    - nvidia.com/gpu=all

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
